
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#21130f">

  <title>Kyune Foxy Spirits | Un mundo de dulces posibilidades</title>

  <style>
    :root {
      --ink: #24140f;
      --red: #a9271e;
      --gold: #d88b3d;
      --cream: #fff0d9;
      --paper: #f8dfbd;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(
          ellipse at 15% 10%,
          rgba(255,255,255,.45),
          transparent 42%
        ),
        repeating-linear-gradient(
          135deg,
          #f6dfc1 0 12px,
          #f2d5b1 12px 24px
        );

      font-family: Georgia, "Times New Roman", serif;
    }

    /* PORTADA PRINCIPAL */

    .poster {
      width: min(100%, 1229px);
      margin: 0 auto;
      position: relative;
      line-height: 0;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(45, 20, 10, .22);
    }

    .poster img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* BOTONES TRANSPARENTES */

    .hotspot {
      position: absolute;
      display: block;
      z-index: 2;
      border-radius: 8px;
      text-indent: -9999px;
      overflow: hidden;
      background: transparent;
      outline-offset: 3px;
    }

    .hotspot:focus-visible {
      outline: 3px solid #ffcf73;
      background: rgba(255, 210, 120, .18);
    }

    /* POSICIÓN DE LOS BOTONES */

    .home-link {
      left: 68.2%;
      top: 1.1%;
      width: 8.8%;
      height: 4.2%;
    }

    .contents-link {
      left: 80.7%;
      top: 1.1%;
      width: 15%;
      height: 4.2%;
    }

    .down-left {
      left: .3%;
      top: 45.5%;
      width: 8.3%;
      height: 14.5%;
    }

    .down-right {
      right: .3%;
      top: 45.5%;
      width: 8.3%;
      height: 14.5%;
    }

    /* SECCIÓN POSTRES */

    .contents {
      width: min(100% - 32px, 1120px);
      margin: 0 auto;
      padding: 54px 0 76px;
      text-align: center;
    }

    .eyebrow {
      color: #9b3a25;
      font-size: .82rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      font-weight: bold;
    }

    h1 {
      margin: 8px 0 12px;
      color: #2a1711;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      line-height: 1;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .ornament {
      width: min(340px, 70%);
      height: 2px;
      margin: 22px auto 34px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        #a94726,
        var(--gold),
        transparent
      );

      position: relative;
    }

    .ornament::after {
      content: "⛩";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -54%);
      padding: 0 14px;
      color: var(--red);
      background: #f7dfbf;
      font-size: 1.6rem;
    }

    .intro {
      max-width: 660px;
      margin: 0 auto 34px;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    /* PIE DE PÁGINA */

    footer {
      padding: 24px 16px;
      color: #fce8ce;
      background: #21130f;
      text-align: center;
      border-top: 3px solid #c9823c;
      letter-spacing: .04em;
    }

    /* ADAPTACIÓN PARA CELULARES */

    @media (max-width: 720px) {

      .contents {
        padding-top: 38px;
      }

    }

    /* ACCESIBILIDAD */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

  </style>
</head>

<body>

  <main>

    <!-- PORTADA -->

    <section
      class="poster"
      id="inicio"
      aria-label="Portada de Kyune Foxy Spirits"
    >

      <img
        src="kyune_foxy_spirits.png"
        alt="Kyune Foxy Spirits: zorros kitsune, flores de cerezo, faroles y templos japoneses."
      >

      <!-- BOTÓN INICIO -->

      <a
        class="hotspot home-link"
        href="#inicio"
        aria-label="Ir al inicio"
      >
        Inicio
      </a>

      <!-- BOTÓN CONTENIDOS -->

      <a
        class="hotspot contents-link"
        href="#postres"
        aria-label="Bajar a postres"
      >
        Contenidos
      </a>

      <!-- FLECHA IZQUIERDA -->

      <a
        class="hotspot down-left"
        href="#postres"
        aria-label="Bajar a postres"
      >
        Bajar a postres
      </a>

      <!-- FLECHA DERECHA -->

      <a
        class="hotspot down-right"
        href="#postres"
        aria-label="Bajar a postres"
      >
        Bajar a postres
      </a>

    </section>

    <!-- ÚNICA SECCIÓN INFERIOR: POSTRES -->

    <section
      class="contents"
      id="postres"
    >

      <div class="eyebrow">
        Kyune Foxy Spirits
      </div>

      <h1>
        Postres
      </h1>

      <div
        class="ornament"
        aria-hidden="true"
      ></div>

      <p class="intro">
        Descubre nuestros postres y encuentra
        tu próximo antojo favorito.
      </p>

    </section>

  </main>

  <!-- PIE DE PÁGINA -->

  <footer>
    ✦ Kyune Foxy Spirits · Un mundo de dulces posibilidades ✦
  </footer>

</body>
</html>
